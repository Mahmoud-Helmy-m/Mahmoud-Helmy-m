name: Metrics

# Generates the profile SVGs and commits them into this repository, so the README
# is served entirely from GitHub and cannot break when a third-party card service
# pauses its deployment or runs out of quota.

on:
  schedule:
    - cron: "0 3 * * *"      # daily, 03:00 UTC
  workflow_dispatch:          # run on demand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    # Steps run sequentially on purpose: each one commits to main, and parallel
    # jobs would race on the push.
    steps:
      - name: Stats (light)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Mahmoud-Helmy-m
          committer_branch: ${{ github.ref_name }}
          filename: metrics.light.svg
          config_timezone: Africa/Cairo
          config_display: large
          # hide the header's "Followed by N user" row (second field in the
          # header's left column)
          extras_css: |
            .row > section:first-of-type > div.field:nth-of-type(2) { display: none; }
          base: header

      - name: Stats (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Mahmoud-Helmy-m
          committer_branch: ${{ github.ref_name }}
          filename: metrics.dark.svg
          config_timezone: Africa/Cairo
          config_display: large
          # v3.34 has no theme input, so the dark variants restyle the SVG directly.
          # Selectors and the colours they replace come from the classic template's
          # style.css: svg{#777} h1,h2,h3{#0366d6} small{#666}.
          extras_css: |
            svg { color: #c9d1d9; }
            h1, h2, h3 { color: #58a6ff; }
            small, .field small { color: #8b949e; }
            .row > section:first-of-type > div.field:nth-of-type(2) { display: none; }
          base: header

      - name: Contribution calendar (light)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Mahmoud-Helmy-m
          committer_branch: ${{ github.ref_name }}
          filename: metrics.calendar.light.svg
          config_timezone: Africa/Cairo
          config_display: large
          extras_css: |
            /* plane on the right, streak figures on the left */
            div.row { flex-direction: row-reverse; }
            section > svg[version="1.1"] { transform: translateX(467px); }
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Contribution calendar (dark)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Mahmoud-Helmy-m
          committer_branch: ${{ github.ref_name }}
          filename: metrics.calendar.dark.svg
          config_timezone: Africa/Cairo
          config_display: large
          # v3.34 has no theme input, so the dark variants restyle the SVG directly.
          # Selectors and the colours they replace come from the classic template's
          # style.css: svg{#777} h1,h2,h3{#0366d6} small{#666}.
          extras_css: |
            svg { color: #c9d1d9; }
            h1, h2, h3 { color: #58a6ff; }
            small, .field small { color: #8b949e; }
            /* plane on the right, streak figures on the left */
            div.row { flex-direction: row-reverse; }
            section > svg[version="1.1"] { transform: translateX(467px); }
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

  languages:
    runs-on: ubuntu-latest
    needs: metrics          # serialise: both jobs commit to the same branch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Build language cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_USER: Mahmoud-Helmy-m
        run: node .github/scripts/languages.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stage first: git diff alone cannot see a file that is still untracked,
          # which silently skipped the very first run
          git add languages.light.svg languages.dark.svg
          if git diff --cached --quiet; then
            echo "No language changes"
            exit 0
          fi
          git commit -m "Update language cards [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

  snake:
    runs-on: ubuntu-latest
    needs: languages       # serialise: every job here commits to the same branch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Mahmoud-Helmy-m
          outputs: |
            snake.light.svg?palette=github-light
            snake.dark.svg?palette=github-dark

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stage first: git diff alone cannot see a file that is still untracked,
          # which silently skipped the very first run
          git add snake.light.svg snake.dark.svg
          if git diff --cached --quiet; then
            echo "No snake changes"
            exit 0
          fi
          git commit -m "Update contribution snake [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
